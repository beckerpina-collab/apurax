services:
  postgres:
    image: postgres:16-alpine
    container_name: apurax-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: apurax_dev
      POSTGRES_DB: apurax
    ports:
      - "5432:5432"
    volumes:
      - apurax_pg:/var/lib/postgresql/data
      # cria o papel não-superusuário apurax_app usado para enforçar RLS
      - ./prisma/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d apurax"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Infra das próximas etapas (parse assíncrono e storage de XML/certificados).
  redis:
    image: redis:7-alpine
    container_name: apurax-redis
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    container_name: apurax-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - apurax_minio:/data

volumes:
  apurax_pg:
  apurax_minio:
